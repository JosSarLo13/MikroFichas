<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sesión Finalizada • Fichas Sarmientos</title>
    <style>
        :root {
            --bg-color: #090D16;
            --surface-glass: rgba(17, 24, 39, 0.85);
            --border-color: rgba(255, 255, 255, 0.08);
            --primary: #06B6D4;
            --text-primary: #F8FAFC;
            --text-secondary: #94A3B8;
            --text-muted: #64748B;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            min-height: 100vh;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .container {
            width: 100%;
            max-width: 390px;
            background: var(--surface-glass);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 28px 24px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        }

        .icon-wrap {
            width: 64px;
            height: 64px;
            margin: 0 auto 16px;
            background: rgba(6, 182, 212, 0.15);
            border: 1px solid rgba(6, 182, 212, 0.3);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary);
        }

        h1 {
            font-size: 22px;
            font-weight: 800;
            color: #FFFFFF;
            margin-bottom: 6px;
        }

        p {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .btn-reconnect {
            width: 100%;
            height: 48px;
            background: linear-gradient(135deg, #06B6D4, #0891B2);
            color: #090D16;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon-wrap">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
        </div>
        <h1>Sesión Pausada</h1>
        <p>Tu tiempo ha dejado de consumirse. Si tu ficha aún tiene tiempo disponible, puedes volver a iniciar sesión cuando gustes.</p>

        <a href="$(link-login)" class="btn-reconnect">
            VOLVER A INICIAR SESIÓN
        </a>
    </div>
</body>
</html>
